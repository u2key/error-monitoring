; Copy to config.ini and adjust.

[serial]
; the tester board's USB-UART
port = /dev/ttyUSB0
baud = 115200

[layout]
; <top>.tmrdff.map from generate-tmr-vhdl --probe: names the register of each bit
map = ../dut/MY_TOP.tmrdff.map

[scan]
; read clocks per design clock: the design runs at read clock / ratio
ratio = 8
; sweep: every address; fixed: addr only; list: the addresses in list_file
mode = sweep
; addr = 1234
; one per line: an address, "bit N" or a register name; or a counters.csv from an
; earlier test, which scans the addresses that had errors
; list_file = suspects.txt
; train the link at the start, and again after each reconfiguration
calibrate = yes
recalibrate = yes

[reconfigure]
; run when the tester reports a configuration error; the scan restarts after it
command = quartus_pgm -c "USB-Blaster [1-1]" -m JTAG -o "p;../dut/output_files/dut.sof"
timeout_s = 120
; wait after programming, for the design to come out of reset
settle_s = 2
; treat a lost readout link (wrong echoes) as a configuration error too
link_loss_is_config = yes
; 0 = no limit
max_reconfigs = 0

[test]
duration_s = 3600
; no: the test runs until it has been scanning for duration_s (downtime added)
; yes: duration_s of wall time, downtime included
count_downtime = no
status_interval_s = 10
; > 0: also dump the counters this often into counters_history.csv
dump_interval_s = 0

[output]
dir = results
